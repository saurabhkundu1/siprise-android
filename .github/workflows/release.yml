name: Build and distribute Siprise

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APPLIFY_DISPATCH_TOKEN: ${{ secrets.APPLIFY_DISPATCH_TOKEN }}
      APPLIFY_RELEASES_ENABLED: ${{ vars.APPLIFY_RELEASES_ENABLED }}
      EXPECTED_WATERTRACKER_SIGNER_SHA256: ${{ vars.EXPECTED_WATERTRACKER_SIGNER_SHA256 }}
      EXPECTED_REPO_SIGNER_SHA256: ${{ vars.EXPECTED_REPO_SIGNER_SHA256 }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Validate release configuration
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Configure the new Siprise app-signing keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure the Siprise keystore password secret}"
          : "${ANDROID_KEY_ALIAS:?Configure the Siprise key alias secret}"
          : "${ANDROID_KEY_PASSWORD:?Configure the Siprise key password secret}"
          : "${APPLIFY_DISPATCH_TOKEN:?Configure a token that can dispatch to Applify}"
          [[ "$APPLIFY_RELEASES_ENABLED" == "true" ]] || { echo "Enable Applify releases after its repository signing-key migration is complete" >&2; exit 1; }
          [[ "$EXPECTED_WATERTRACKER_SIGNER_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]
          [[ "$EXPECTED_REPO_SIGNER_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]
          [[ "${EXPECTED_WATERTRACKER_SIGNER_SHA256^^}" != "DE62E0D386DB9B6FC616ADF6573F458AAC8D04F873007C73B8585FBEF0960255" ]]
          [[ "${EXPECTED_REPO_SIGNER_SHA256^^}" != "DE62E0D386DB9B6FC616ADF6573F458AAC8D04F873007C73B8585FBEF0960255" ]]
          [[ "${EXPECTED_WATERTRACKER_SIGNER_SHA256^^}" != "${EXPECTED_REPO_SIGNER_SHA256^^}" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$RELEASE_TAG" == "v$VERSION_NAME" && -n "$VERSION_CODE" ]]

      - name: Build, sign, verify, publish, and import APK
        run: |
          set -euo pipefail
          VERSION_NAME="${RELEASE_TAG#v}"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not configured}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;37.0.0"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

          KEYSTORE="$RUNNER_TEMP/siprise-release.jks"
          APK="$RUNNER_TEMP/siprise-${RELEASE_TAG#v}.apk"
          BUILD_TOOLS="$SDK_ROOT/build-tools/37.0.0"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          trap 'rm -f "$KEYSTORE"' EXIT
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
          [[ "$(grep -Ec '^Signer #[0-9]+:?[[:space:]]+certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt")" == "1" ]]
          ACTUAL_SIGNER="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner.txt" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          [[ "$ACTUAL_SIGNER" == "${EXPECTED_WATERTRACKER_SIGNER_SHA256^^}" ]]
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          grep -F "package: name='com.applify.watertracker' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING"
          ! grep -q 'android.permission.INTERNET' <<< "$BADGING"
          CHECKSUM="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          printf 'Siprise %s\n\nSHA-256: %s\n' "$VERSION_NAME" "$CHECKSUM" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" --title "Siprise $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          jq -n --arg version "$VERSION_NAME" --arg code "$VERSION_CODE" --arg tag "$RELEASE_TAG" --arg asset "siprise-${VERSION_NAME}.apk" \
            '{event_type:"new_release",client_payload:{source_repo:"saurabhkundu1/siprise-android",package_name:"com.applify.watertracker",version:$version,version_code:$code,tag:$tag,asset_name:$asset}}' > "$RUNNER_TEMP/dispatch.json"
          curl --fail --silent --show-error --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $APPLIFY_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/dispatch.json" \
            https://api.github.com/repos/saurabhkundu1/Applify/dispatches
